<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open ABA</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6f8;color:#111}
  .card{max-width:360px;margin:16px;padding:28px 22px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
  a.btn{display:block;margin:18px 0 8px;padding:14px;border-radius:12px;background:#0b5cff;color:#fff;text-decoration:none;font-weight:600;font-size:17px}
  p{margin:8px 0;color:#555;font-size:14px;line-height:1.5}
  .err{color:#b00020}
</style>
</head>
<body>
<div class="card">
  <h2 id="title">📲 បើកកម្មវិធី ABA</h2>
  <p id="msg">កំពុងបើកកម្មវិធី ABA…</p>
  <a id="open" class="btn" href="#">បើក ABA ដើម្បីបង់ប្រាក់</a>
  <p id="hint">បើមិនបើក សូមត្រឡប់ទៅ Telegram រក្សាទុករូប QR ហើយស្កេនក្នុង ABA។</p>
</div>
<script>
  // Only ABA PayWay deep links are allowed, so this page cannot be used to open anything else.
  var PREFIX = "abamobilebank://ababank.com?type=payway&qrcode=";
  var d = new URLSearchParams(location.search).get("d") || "";
  var btn = document.getElementById("open");
  var msg = document.getElementById("msg");
  if (d.indexOf(PREFIX) === 0) {
    btn.href = d;
    setTimeout(function () { location.href = d; }, 300);
    // When the user comes back from ABA, show a thank-you screen.
    var left = false;
    function thanks() {
      document.getElementById("title").textContent = "🙏 សូមអរគុណ!";
      msg.textContent = "ប្រសិនបើអ្នកបានបង់ប្រាក់រួច សូមត្រឡប់ទៅ Telegram ដើម្បីមើលការបញ្ជាក់ ✅ (bot នឹងផ្ញើសារទទួលបានការបង់ប្រាក់ស្វ័យប្រវត្តិ)";
      btn.textContent = "បើក ABA ម្តងទៀត";
      btn.style.background = "#6b7280";
      document.getElementById("hint").textContent = "អ្នកអាចបិទទំព័រនេះ ហើយត្រឡប់ទៅ Telegram បាន។";
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { left = true; }
      else if (left) { thanks(); }
    });
    window.addEventListener("pagehide", function () { left = true; });
    window.addEventListener("pageshow", function () { if (left) { thanks(); } });
  } else {
    msg.textContent = "តំណមិនត្រឹមត្រូវ សូមត្រឡប់ទៅ Telegram ហើយស្កេន QR។";
    msg.className = "err";
    btn.style.display = "none";
  }
</script>
</body>
</html>
